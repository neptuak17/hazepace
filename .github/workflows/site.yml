# Publishes site/ to GitHub Pages, served at hazepace.com.
#
# Runs when a push to main changes the site or this file, and on demand
# from the Actions tab. There is no build step: site/ is uploaded as it is.
# The custom domain is set in the repository's Pages settings, not by a
# CNAME file, which Actions deployments ignore.
name: Publish site

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/site.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push waits rather than cancelling one
# already under way, so the site is never left half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
